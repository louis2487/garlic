publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  flutter_dotenv: ^5.2.1
  dio: ^5.2.1+1
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.5.2
  flutter_map: ^8.1.1
